plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}


version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
}

repositories {
    maven { url = 'https://bangbang93.com' }
    mavenCentral()
    maven { url = 'https://neoforged.net' }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.named('processResources') {
    doLast {
        def resDir = file("${buildDir}/resources/main")
        def texDir = new File(resDir, "assets/axeanimals/textures/item")
        def itemsDir = new File(resDir, "assets/axeanimals/items")
        def modelsDir = new File(resDir, "assets/axeanimals/models/item")
        def langDir = new File(resDir, "assets/axeanimals/lang")
        [texDir, itemsDir, modelsDir, langDir].each { it.mkdirs() }

        def meats = [
            whale_meat:    [c1: 0xFFB83B4B, c2: 0xFFD95B6B, fat: 0xFFF7DCE0, shape: 'steak'],
            orca_meat:     [c1: 0xFF9E2A3B, c2: 0xFFC24455, fat: 0xFFF2D0D5, shape: 'steak'],
            stingray_meat: [c1: 0xFFE6B8B8, c2: 0xFFF5D5D5, fat: 0xFFFFF0F0, shape: 'wing']
        ]

        meats.each { name, cfg ->
            def img = new java.awt.image.BufferedImage(16, 16, java.awt.image.BufferedImage.TYPE_INT_ARGB)
            for (int y = 0; y < 16; y++) {
                for (int x = 0; x < 16; x++) {
                    double dx = (x - 7.5) / (cfg.shape == 'wing' ? 6.5 : 5.5)
                    double dy = (y - 7.5) / (cfg.shape == 'wing' ? 4.2 : 4.8)
                    double d = dx * dx + dy * dy
                    if (d <= 1.0) {
                        int col = (d > 0.72) ? 0xFF2B1414 : (((x + y) % 4 == 0) ? cfg.fat : (((x * 3 + y) % 2 == 0) ? cfg.c1 : cfg.c2))
                        img.setRGB(x, y, col)
                    }
                }
            }
            javax.imageio.ImageIO.write(img, "PNG", new File(texDir, "${name}.png"))
            new File(itemsDir, "${name}.json").text = """{"model":{"type":"minecraft:model","model":"axeanimals:item/${name}"}}"""
            new File(modelsDir, "${name}.json").text = """{"parent":"minecraft:item/generated","textures":{"layer0":"axeanimals:item/${name}"}}"""
        }

        def ruFile = new File(langDir, "ru_ru.json")
        def ruMap = ruFile.exists() ? new groovy.json.JsonSlurper().parse(ruFile) : [:]
        ruMap["item.axeanimals.whale_meat"] = "Мясо кита"
        ruMap["item.axeanimals.orca_meat"] = "Мясо косатки"
        ruMap["item.axeanimals.stingray_meat"] = "Мясо ската"
        ruFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(ruMap))

        def enFile = new File(langDir, "en_us.json")
        def enMap = enFile.exists() ? new groovy.json.JsonSlurper().parse(enFile) : [:]
        enMap["item.axeanimals.whale_meat"] = "Whale Meat"
        enMap["item.axeanimals.orca_meat"] = "Orca Meat"
        enMap["item.axeanimals.stingray_meat"] = "Stingray Meat"
        enFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(enMap))
    }
}

