name: Build AxeAnimals Mod

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew build > build.log 2>&1 || (grep -E "error:|FAILED|Exception" build.log | tail -n 15 | while read line; do echo "::error::$line"; done; exit 1)
      - name: Publish JAR to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AxeAnimals Latest Build
          files: build/libs/*.jar
